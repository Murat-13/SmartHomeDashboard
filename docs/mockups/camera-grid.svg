<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1600" height="1060" fill="#1b1f22"/>
  <rect x="20" y="20" width="1560" height="980" rx="34" fill="#0A1014" stroke="#2a2f33" stroke-width="10"/>
  <text x="70" y="88" fill="#ffffff" font-size="38" font-weight="bold">Камеры</text>
  <text x="1530" y="88" fill="#C8D6DE" font-size="28" text-anchor="end">4 камеры · 2 пишут</text>
  <!-- 1 Домофон: человек -->
  <g>
    <rect x="60" y="115" width="725" height="420" rx="22" fill="#22333a" stroke="#FFB74D" stroke-width="6"/>
    <text x="90" y="165" fill="#fff" font-size="34" font-weight="bold">Домофон</text>
    <text x="90" y="205" fill="#FFB74D" font-size="26">Человек у калитки</text>
    <text x="755" y="165" fill="#FF5252" font-size="26" font-weight="bold" text-anchor="end">● REC</text>
    <circle cx="640" cy="155" r="16" fill="none" stroke="#FFB74D" stroke-width="4"/>
    <text x="422" y="360" fill="#5c7680" font-size="28" text-anchor="middle">живое видео (субпоток)</text>
  </g>
  <!-- 2 Ворота -->
  <g>
    <rect x="815" y="115" width="725" height="420" rx="22" fill="#22333a" stroke="#347880" stroke-width="3"/>
    <text x="845" y="165" fill="#fff" font-size="34" font-weight="bold">Ворота</text>
    <text x="845" y="205" fill="#C8D6DE" font-size="26">В сети</text>
    <text x="1510" y="165" fill="#FF5252" font-size="26" font-weight="bold" text-anchor="end">● REC</text>
    <text x="1177" y="360" fill="#5c7680" font-size="28" text-anchor="middle">живое видео (субпоток)</text>
  </g>
  <!-- 3 Двор: машина -->
  <g>
    <rect x="60" y="560" width="725" height="420" rx="22" fill="#22333a" stroke="#347880" stroke-width="3"/>
    <text x="90" y="610" fill="#fff" font-size="34" font-weight="bold">Двор</text>
    <text x="90" y="650" fill="#C8D6DE" font-size="26">Машина</text>
    <rect x="700" y="585" width="56" height="34" rx="8" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="422" y="800" fill="#5c7680" font-size="28" text-anchor="middle">живое видео (субпоток)</text>
  </g>
  <!-- 4 Сад: нет сигнала -->
  <g>
    <rect x="815" y="560" width="725" height="420" rx="22" fill="#151a1d" stroke="#FF5252" stroke-width="6"/>
    <text x="845" y="610" fill="#fff" font-size="34" font-weight="bold">Сад</text>
    <text x="1177" y="770" fill="#FF5252" font-size="34" font-weight="bold" text-anchor="middle">Нет сигнала с 02:14</text>
  </g>
  <circle cx="785" cy="1030" r="0" fill="none"/>
  <text x="800" y="1045" fill="#C8D6DE" font-size="26" text-anchor="middle">Касание — камера крупно · янтарная рамка — человек · красная — нет сигнала</text>
</svg>

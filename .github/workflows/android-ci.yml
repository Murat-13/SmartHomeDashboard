# Проверка проекта на GitHub Actions: юнит-тесты (Robolectric),
# сборка debug-APK и сборка инструментальных тестов.
# Запускается на каждом PR и при каждом push в main.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый push в тот же PR отменяет предыдущую, уже ненужную проверку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow только читает код; секреты ему не нужны.
permissions:
  contents: read

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Кэширует зависимости Gradle и проверяет подлинность gradle-wrapper.jar.
      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v5

      # Android SDK уже есть на ubuntu-latest (ANDROID_HOME), лицензии приняты.
      # Недостающую платформу android-34 AGP скачает сам.
      - name: Тесты и сборка
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Отчёты тестов при падении
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
